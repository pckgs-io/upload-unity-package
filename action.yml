name: Upload Package
description: Uploads a Unity package to pckgs.io

inputs:
  package_folder:
    description: 'Path to the Unity package folder to compress and upload. Defaults to the repository root if omitted.'
    required: false

  access_token:
    description: 'Access token used to authenticate with pckgs.io.'
    required: true

  is_public:
    description: 'Whether the package should be publicly available.'
    required: true

  version:
    description: 'Version of the package (e.g., 1.0.0).'
    required: false

  contributor_email:
    description: 'Email address of the contributor.'
    required: false

  contributor_name:
    description: 'Name or nickname of the contributor.'
    required: false

  contributor_url:
    description: ‘URL to the contributor’s profile (e.g., GitHub, website).’
    required: false

  organization:
    description: ‘Organization slug on pckgs.io. If omitted, extracted from the second segment of the package name (e.g., "com.myorg.package" → "myorg").’
    required: false
runs:
  using: 'node16'
  main: 'dist/index.js'
